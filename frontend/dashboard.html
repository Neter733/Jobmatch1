<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your matches — JobMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-logo">JobMatch<span>.</span></a>
      <div style="flex:1"></div>
      <a href="jobs.html" class="btn btn-outline" style="padding:8px 16px;font-size:0.85rem;margin-right:8px;">Browse jobs</a>
      <a href="onboarding.html" class="btn btn-outline" style="padding:8px 16px;font-size:0.85rem;margin-right:12px;">Edit profile</a>
      <div class="notif-bell" id="notif-bell">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-badge" id="notif-badge" style="display:none;"></span>
        <div class="notif-dropdown" id="notif-dropdown"></div>
      </div>
    </div>
  </header>

  <main class="wide-shell">
    <h1 style="font-size:1.4rem;margin-bottom:4px;">Your matched jobs</h1>
    <p style="font-size:0.9rem;color:var(--muted);margin-bottom:20px;">Select the roles you want us to apply to, or apply to all matches at once.</p>

    <div class="metrics-grid" id="my-stats-grid" style="margin-bottom:24px;"></div>

    <p class="spinner-text" id="loading-text">Loading your matches…</p>
    <div class="job-grid" id="job-grid"></div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <button class="btn btn-primary" id="apply-selected-btn" disabled>Apply to 0 selected (₦0)</button>
      <button class="btn btn-outline" id="apply-all-btn">Apply to all matches</button>
    </div>
    <p class="error-text" id="apply-error" style="display:none;"></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
