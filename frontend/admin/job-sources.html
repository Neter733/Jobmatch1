<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job sources — JobMatch Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body style="background:var(--bg);">

  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar-root"></aside>
    <main class="admin-main">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h1 style="font-size:1.3rem;margin:0;">Job sources</h1>
        <button class="btn btn-primary" id="sync-all-btn">Sync all now</button>
      </div>
      <p style="font-size:0.85rem;color:var(--muted);margin-bottom:20px;">
        Toggle sources on/off and update their API keys without a redeploy. A brand-new API type (not listed here) still needs its own connector written first.
      </p>

      <p id="sync-result" style="display:none;font-size:0.85rem;background:rgba(27,156,110,0.08);color:var(--success);padding:12px;border-radius:8px;margin-bottom:16px;"></p>

      <p class="spinner-text" id="loading-text">Loading sources…</p>
      <div id="sources-list"></div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script>
    renderAdminLayout('job-sources');

    async function loadSources() {
      const loadingText = document.getElementById('loading-text');
      try {
        const sources = await api.get('/team/job-sources', ADMIN_OPTS);
        loadingText.style.display = 'none';
        document.getElementById('sources-list').innerHTML = sources.map((s) => `
          <div class="source-row">
            <button class="source-toggle ${s.enabled ? 'on' : ''}" data-key="${s.key}" data-enabled="${s.enabled}"></button>
            <div style="flex:1;min-width:180px;">
              <p style="font-size:0.9rem;font-weight:500;margin:0;">${escapeHtml(s.label)}</p>
              <p style="font-size:0.78rem;color:var(--muted);margin:2px 0 0;">
                ${s.needsKey ? `Needs a key (format: ${s.keyFormat}) — ${s.hasApiKey ? 'currently set' : 'not set yet'}` : 'No API key required'}
              </p>
            </div>
            ${s.needsKey ? `
              <input type="text" class="field key-input" data-key="${s.key}" placeholder="${s.keyFormat}" style="max-width:240px;font-size:0.82rem;padding:8px 10px;" />
              <button class="btn btn-outline save-key-btn" data-key="${s.key}" data-label="${escapeHtml(s.label)}" style="padding:8px 14px;font-size:0.8rem;">Save key</button>
            ` : ''}
          </div>
        `).join('');

        document.querySelectorAll('.source-toggle').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const key = btn.dataset.key;
            const label = sources.find((s) => s.key === key).label;
            const newEnabled = btn.dataset.enabled !== 'true';
            await api.post('/team/job-sources', { key, label, enabled: newEnabled }, ADMIN_OPTS);
            loadSources();
          });
        });

        document.querySelectorAll('.save-key-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const key = btn.dataset.key;
            const input = document.querySelector(`.key-input[data-key="${key}"]`);
            if (!input.value.trim()) return;
            await api.post('/team/job-sources', { key, label: btn.dataset.label, apiKey: input.value.trim(), enabled: true }, ADMIN_OPTS);
            loadSources();
          });
        });
      } catch (err) {
        loadingText.textContent = err.message;
      }
    }

    document.getElementById('sync-all-btn').addEventListener('click', async () => {
      const btn = document.getElementById('sync-all-btn');
      btn.disabled = true;
      btn.textContent = 'Syncing… (this can take a minute)';
      try {
        const results = await api.post('/team/job-sources/sync-all', {}, ADMIN_OPTS);
        const resultEl = document.getElementById('sync-result');
        resultEl.style.display = 'block';
        resultEl.innerHTML = Object.entries(results).map(([name, r]) =>
          `${name}: ${r.error ? `error — ${r.error}` : r.skipped ? `skipped (${r.reason})` : `${r.totalSynced} synced`}`
        ).join('<br>');
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sync all now';
      }
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    loadSources();
  </script>
</body>
</html>
